const Field=({l,v,set,t="text",ph})=><div><label>{l}</label><input type={t} value={v} placeholder={ph} onChange={e=>set(e.target.value)}/></div>;

function chime(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[523,659,784].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.15,c.currentTime+i*.15);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.15+.5);o.start(c.currentTime+i*.15);o.stop(c.currentTime+i*.15+.5)})}catch(e){}}

function Login({onOk}){
  const cred=ld('mg_cred',null);
  const [mode,setMode]=useState(cred?cred.mode:'pin');
  const [name,setName]=useState(ld('mg_name',''));
  const [pin,setPin]=useState('');const [pat,setPat]=useState([]);const [err,setErr]=useState('');
  const [granted,setGranted]=useState(false);
  const val=mode==='pin'?pin:pat.join('-');
  const ready=mode==='pin'?pin.length===4:pat.length>=4;
  const go=()=>{
    if(!name.trim())return setErr('Ingrese su nombre o título');
    if(!cred)sv('mg_cred',{mode,val});
    else if(cred.val!==val){setErr('Credencial incorrecta');setPin('');setPat([]);return}
    sv('mg_name',name.trim());setGranted(true);chime();setTimeout(()=>onOk(name.trim()),2200);
  };
  if(granted)return <div className="min-h-screen flex items-center justify-center text-center p-6"><div className="pop"><img src={LOGO} style={{height:150,margin:'0 auto 16px'}}/><h1 className="text-3xl gold font-bold">Acceso Concedido</h1><p className="text-xl mt-2">Centro de Mando Activado</p><p className="mt-4 text-slate-400">{greet()}, {name}</p></div></div>;
  return <div className="min-h-screen flex items-center justify-center p-4"><div className="card p-6 w-full max-w-sm text-center">
    <img src={LOGO} style={{height:110,margin:'0 auto'}}/>
    <h1 className="text-2xl font-bold gold mt-2">{CO}</h1><p className="text-xs text-slate-400 mb-4 tracking-widest">EXECUTIVE VIP ACCESS</p>
    <div className="text-left mb-3"><Field l="Nombre / Título (ej: Director Megan, Jefe)" v={name} set={setName}/></div>
    {!cred&&<div className="flex gap-2 mb-3">{['pin','pattern'].map(m=><button key={m} onClick={()=>{setMode(m);setPin('');setPat([])}} className={'btn flex-1 '+(mode===m?'p':'')}>{m==='pin'?'PIN 4 dígitos':'Patrón'}</button>)}</div>}
    {mode==='pin'?<div><div className="text-3xl tracking-[.6em] h-10 gold">{'●'.repeat(pin.length)}{'○'.repeat(4-pin.length)}</div>
      <div className="grid grid-cols-3 gap-2 mt-2">{[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(k=><button key={k} className="card py-3 text-xl" onClick={()=>{if(k==='C')setPin('');else if(k==='⌫')setPin(pin.slice(0,-1));else if(pin.length<4)setPin(pin+k)}}>{k}</button>)}</div></div>
    :<div><p className="text-xs text-slate-400 mb-2">Toque al menos 4 puntos en secuencia</p><div className="grid grid-cols-3 gap-4 w-48 mx-auto">{[...Array(9)].map((_,i)=>{const ix=pat.indexOf(i);return <button key={i} onClick={()=>!pat.includes(i)&&setPat([...pat,i])} className={'w-12 h-12 rounded-full border-2 mx-auto text-sm '+(ix>=0?'bg-gold border-yellow-500':'border-slate-500')}>{ix>=0?ix+1:''}</button>})}</div><button className="text-xs text-slate-400 mt-2" onClick={()=>setPat([])}>Reiniciar patrón</button></div>}
    {err&&<p className="text-red-400 text-sm mt-2">{err}</p>}
    <button disabled={!ready} onClick={go} className="btn p w-full mt-4 disabled:opacity-40">{cred?'Ingresar':'Crear acceso e ingresar'}</button>
  </div></div>;
}

const Doc=({logo,children,onBack})=><div className="min-h-screen bg-slate-300 p-3"><div className="no-print flex gap-2 mb-3 max-w-3xl mx-auto"><button className="btn bg-white" onClick={onBack}><I n="back"/> Volver</button><button className="btn p" onClick={()=>window.print()}><I n="print"/> Imprimir / Guardar PDF</button></div>
  <div className="sheet max-w-3xl mx-auto shadow-xl"><div className="wm">{logo?<img src={logo}/>:<div style={{fontSize:60,fontWeight:700,transform:'rotate(-30deg)',textAlign:'center'}}>{CO}</div>}</div>
  <div className="flex justify-between border-b-2 border-yellow-600 pb-3 mb-4"><div className="flex items-center gap-3"><img src={logo||LOGO} style={{height:64}}/><div><h1 className="text-2xl font-bold">{CO}</h1><p className="text-sm text-gray-600">Roofing &amp; Siding · Snow Plowing</p></div></div><p className="text-sm">Tel: {PHONE}</p></div>{children}</div></div>;

function Quotes({logo,boss,quotes,setQuotes}){
  const blank={svc:'Roofing & Siding',client:'',addr:'',mats:[{n:'',q:1,p:0}],hrs:8,rate:25,crew:2,ops:[{n:'Combustible',c:0}],margin:30};
  const [q,setQ]=useState(blank);const [view,setView]=useState(false);
  const mat=q.mats.reduce((a,m)=>a+num(m.q)*num(m.p),0),lab=num(q.hrs)*num(q.rate)*num(q.crew),op=q.ops.reduce((a,o)=>a+num(o.c),0);
  const cost=mat+lab+op,price=cost*(1+num(q.margin)/100),profit=price-cost;
  const up=(k,v)=>setQ({...q,[k]:v});
  const upl=(k,i,f,v)=>up(k,q[k].map((x,j)=>j===i?{...x,[f]:v}:x));
  const save=()=>{setQuotes([...quotes,{...q,price,profit,cost,status:'Pendiente',ts:Date.now(),date:new Date().toLocaleDateString()}]);setQ(blank)};
  if(view)return <Doc logo={logo||LOGO} onBack={()=>setView(false)}>
    <h2 className="text-xl font-bold mb-1">PROFORMA / COTIZACIÓN</h2><p className="text-sm mb-4">Fecha: {new Date().toLocaleDateString()} · Servicio: {q.svc}</p>

function Calc(){
  const [m,setM]=useState('roof');const [a,setA]=useState(1000);const [c,setC]=useState(4);const [mg,setMg]=useState(35);
  const cost=m==='roof'?num(a)*num(c):num(a)/1000*num(c),price=cost*(1+num(mg)/100);
  return <div className="card p-4 space-y-3"><div className="flex gap-2">{[['roof','Techos / Siding'],['snow','Remoción de nieve']].map(([k,l])=><button key={k} className={'btn flex-1 '+(m===k?'p':'')} onClick={()=>{setM(k);setC(k==='roof'?4:35)}}>{l}</button>)}</div>
    <Field l={m==='roof'?'Pies cuadrados (sq ft)':'Área a despejar (sq ft)'} t="number" v={a} set={setA}/><Field l={m==='roof'?'Costo real por sq ft $':'Costo real por 1,000 sq ft $'} t="number" v={c} set={setC}/><Field l="Margen deseado %" t="number" v={mg} set={setMg}/>
    <div className="grid grid-cols-2 gap-3 text-center"><div className="card p-3"><label>Costo real</label><p className="text-xl">{$(cost)}</p></div><div className="card p-3"><label>Precio sugerido</label><p className="text-xl font-bold text-green-400">{$(price)}</p></div></div><p className="text-center gold">Ganancia estimada: {$(price-cost)}</p></div>;
}

function Reports({logo,quotes,setQuotes}){
  const [view,setView]=useState(false);
  const ST=['Pendiente','En proceso','Completado'];
  const L=quotes.map((x,i)=>({...x,i,st:x.status||'Pendiente'}));
  const done=L.filter(x=>x.st==='Completado'),open=L.filter(x=>x.st!=='Completado');
  const sum=(a,k)=>a.reduce((s,x)=>s+num(x[k]),0);
  const sales=sum(done,'price'),gain=sum(done,'profit');
  const months={};
  done.forEach(x=>{const k=new Date(x.ts||Date.now()).toLocaleDateString('es',{month:'long',year:'numeric'});months[k]=(months[k]||0)+num(x.profit)});
  const mx=Math.max(1,...Object.values(months));
  const setSt=(i,v)=>setQuotes(quotes.map((x,j)=>j===i?{...x,status:v}:x));
  const bySvc=['Roofing & Siding','Snow Plowing'].map(s=>{const a=done.filter(x=>x.svc===s);return {s,n:a.length,v:sum(a,'price'),g:sum(a,'profit')}});
  const K=({l,v,c})=><div className="card p-4"><label>{l}</label><p className={'text-xl font-bold '+(c||'')}>{v}</p></div>;
  if(view)return <Doc logo={logo||LOGO} onBack={()=>setView(false)}>
    <h2 className="text-xl font-bold mb-1">REPORTE DE GANANCIAS</h2><p className="text-sm mb-3">Emitido: {new Date().toLocaleDateString()} · Trabajos completados: {done.length}</p>
    <p className="text-sm mb-4"><b>Ventas:</b> {$(sales)} · <b>Ganancia neta:</b> {$(gain)} · <b>Por cobrar/en curso:</b> {$(sum(open,'price'))}</p>
    <table className="w-full text-sm"><thead><tr className="border-b-2 text-left"><th>Fecha</th><th>Cliente</th><th>Servicio</th><th>Estado</th><th className="text-right">Venta</th><th className="text-right">Ganancia</th></tr></thead><tbody>{L.map(x=><tr key={x.i} className="border-b"><td>{x.date}</td><td>{x.client||'—'}</td><td>{x.svc}</td><td>{x.st}</td><td className="text-right">{$(x.price)}</td><td className="text-right">{$(x.profit)}</td></tr>)}</tbody></table></Doc>;
  return <div className="space-y-3">
    <div className="grid grid-cols-2 gap-3"><K l="Ventas completadas" v={$(sales)}/><K l="Ganancia realizada" v={$(gain)} c="text-green-400"/><K l="Trabajos completados" v={done.length}/><K l="Ganancia pendiente" v={$(sum(open,'profit'))} c="gold"/></div>
    <div className="card p-4"><h3 className="gold font-bold mb-2">Por servicio (completados)</h3>{bySvc.map(s=><div key={s.s} className="flex justify-between text-sm border-b border-slate-700 py-1"><span>{s.s} ({s.n})</span><span>{$(s.v)} · <b className="text-green-400">{$(s.g)}</b></span></div>)}</div>
    {Object.keys(months).length>0&&<div className="card p-4 space-y-2"><h3 className="gold font-bold">Ganancia por mes</h3>{Object.entries(months).map(([k,v])=><div key={k}><div className="flex justify-between text-sm"><span className="capitalize">{k}</span><span>{$(v)}</span></div><div className="h-2 rounded bg-slate-700"><div className="h-2 rounded bg-gold" style={{width:(v/mx*100)+'%'}}/></div></div>)}</div>}
    <div className="card p-4"><div className="flex justify-between items-center mb-2"><h3 className="gold font-bold">Historial de trabajos ({L.length})</h3><button className="btn p" onClick={()=>setView(true)}><I n="print" s={14}/> Reporte</button></div>
    {L.length===0&&<p className="text-sm text-slate-400">Guarde cotizaciones en el módulo Cotizar y aparecerán aquí. Marque cada trabajo como Completado para sumarlo a sus ganancias.</p>}
    {[...L].reverse().map(x=><div key={x.i} className="border-b border-slate-700 py-2 text-sm"><div className="flex justify-between"><span>{x.date} · {x.client||'Sin cliente'}</span><span>{$(x.price)}</span></div><div className="flex justify-between items-center mt-1"><span className="text-slate-400">{x.svc} · ganancia <b className="text-green-400">{$(x.profit)}</b></span><div className="flex gap-2 items-center"><div style={{width:130}}><select value={x.st} onChange={e=>setSt(x.i,e.target.value)}>{ST.map(s=><option key={s}>{s}</option>)}</select></div><button onClick={()=>setQuotes(quotes.filter((_,j)=>j!==x.i))}><I n="trash" s={14}/></button></div></div></div>)}</div></div>;
}

function Backup({data,onRestore,onClose}){
  const [t,setT]=useState('');const [m,setM]=useState('');
  const json=JSON.stringify(data);
  const ta={background:'#0f172a',color:'#fff',width:'100%',borderRadius:8,padding:8,fontSize:11,border:'1px solid #475569'};
  const copy=()=>{sv('mg_lastbk',Date.now());try{navigator.clipboard.writeText(json).then(()=>setM('Copiado. Guárdelo en un lugar seguro (WhatsApp, correo o notas).'),()=>setM('Seleccione el texto y cópielo manualmente.'))}catch(e){setM('Seleccione el texto y cópielo manualmente.')}};
  const restore=()=>{try{const d=JSON.parse(t);if(!Array.isArray(d.quotes)||!Array.isArray(d.emps))throw 0;onRestore(d);setM('Datos restaurados.')}catch(e){setM('El texto no es un respaldo válido.')}};
  return <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-3"><div className="card p-4 w-full max-w-lg max-h-[90vh] overflow-auto space-y-2">
    <h3 className="gold font-bold">Respaldo de datos</h3>
    <p className="text-xs text-slate-400">Copie este código (cotizaciones y planilla) y guárdelo. Si algún día se pierden los datos, péguelo abajo para recuperarlos. El logo se vuelve a cargar con el botón Logo.</p>
    <textarea readOnly value={json} onFocus={e=>e.target.select()} rows={4} style={ta}/>
    <button className="btn p w-full" onClick={copy}>Copiar respaldo</button>
    <textarea value={t} onChange={e=>setT(e.target.value)} placeholder="Pegue aquí un respaldo para restaurar (reemplaza los datos actuales)" rows={3} style={ta}/>
    <button className="btn w-full" onClick={restore}>Restaurar datos</button>
    {m&&<p className="text-sm gold">{m}</p>}<button className="btn w-full" onClick={onClose}>Cerrar</button></div></div>;
}

  const [logo,setLogo]=useState(ld('mg_logo',''));
  const [quotes,setQuotes]=useState(ld('mg_q',[]));const [emps,setEmps]=useState(ld('mg_e',[]));const [inv,setInv]=useState(ld('mg_i',[]));useEffect(()=>sv('mg_i',inv),[inv]);
  useEffect(()=>sv('mg_q',quotes),[quotes]);useEffect(()=>sv('mg_e',emps),[emps]);useEffect(()=>sv('mg_logo',logo),[logo]);useEffect(()=>{try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}},[]);const [bk,setBk]=useState(false);
  if(!boss)return <Welcome onOk={n=>{sv('mg_name',n);setBoss(n)}}/>;
  if(splash)return <Splash name={boss}/>;
  const up=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>setLogo(r.result);r.readAsDataURL(f)};
  const T=[['dash','home','Mando'],['quotes','file','Cotizar'],['inv','file','Facturas'],['pay','users','Planilla'],['calc','calc','Calcular'],['rep','chart','Reportes']];
  return <div className="max-w-3xl mx-auto p-3 pb-24">
    <header className="flex justify-between items-center mb-3"><div><div className="flex items-center gap-2"><img src={logo||LOGO} style={{height:40}}/><h1 className="gold font-bold text-lg">{CO}</h1></div><p className="text-xs text-slate-400">Tel: {PHONE}</p></div>
    <div className="flex gap-2"><label className="btn cursor-pointer" style={{textTransform:'none',letterSpacing:0,fontSize:14,color:'#d4af37'}}><I n="img" s={16}/> Logo<input type="file" accept="image/*" className="hidden" onChange={up}/></label><button className="btn" style={{fontSize:14}} onClick={()=>setBk(true)}>Respaldo</button><button className="btn" style={{fontSize:14}} onClick={()=>{sv('mg_name','');setBoss('')}}>Nombre</button></div></header>
    {(quotes.length+emps.length+inv.length>0&&Date.now()-ld('mg_lastbk',Date.now())>12096e5)&&<div className="card p-3 mb-3 text-sm gold">Hace tiempo que no hace un respaldo de su información. Toque <b>Respaldo</b> arriba y copie el código en un lugar seguro.</div>}{tab==='dash'&&<Dash boss={boss} quotes={quotes} emps={emps} inv={inv}/>}{tab==='quotes'&&<Quotes logo={logo||LOGO} boss={boss} quotes={quotes} setQuotes={setQuotes}/>}{tab==='pay'&&<Payroll logo={logo||LOGO} boss={boss} emps={emps} setEmps={setEmps}/>}{tab==='calc'&&<Calc/>}{tab==='inv'&&<Invoices logo={logo||LOGO} quotes={quotes} inv={inv} setInv={setInv}/>}{tab==='rep'&&<Reports logo={logo||LOGO} quotes={quotes} setQuotes={setQuotes}/>}
    <nav className="fixed bottom-0 inset-x-0 bg-slate-900 border-t border-slate-700 flex justify-around py-2" style={{paddingBottom:'calc(8px + env(safe-area-inset-bottom,0px))'}}>{T.map(([k,ic,l])=><button key={k} onClick={()=>setTab(k)} className={'flex flex-col items-center text-xs '+(tab===k?'gold':'text-slate-400')}><I n={ic} s={22}/>{l}</button>)}</nav>{bk&&<Backup data={{quotes,emps,inv}} onRestore={d=>{setQuotes(d.quotes);setEmps(d.emps);if(Array.isArray(d.inv))setInv(d.inv)}} onClose={()=>setBk(false)}/>}</div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
